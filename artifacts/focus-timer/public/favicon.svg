<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#clockGradient)" filter="url(#shadow)"/>
  
  <!-- Inner circle (clock face) -->
  <circle cx="256" cy="256" r="200" fill="#ffffff" opacity="0.95"/>
  
  <!-- Hour markers -->
  <g stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.6">
    <!-- 12 o'clock -->
    <line x1="256" y1="76" x2="256" y2="96"/>
    <!-- 3 o'clock -->
    <line x1="436" y1="256" x2="416" y2="256"/>
    <!-- 6 o'clock -->
    <line x1="256" y1="436" x2="256" y2="416"/>
    <!-- 9 o'clock -->
    <line x1="76" y1="256" x2="96" y2="256"/>
  </g>
  
  <!-- Minute markers -->
  <g stroke="#667eea" stroke-width="4" stroke-linecap="round" opacity="0.3">
    <line x1="256" y1="66" x2="256" y2="86" transform="rotate(30 256 256)"/>
    <line x1="256" y1="66" x2="256" y2="86" transform="rotate(60 256 256)"/>
    <line x1="256" y1="66" x2="256" y2="86" transform="rotate(120 256 256)"/>
    <line x1="256" y1="66" x2="256" y2="86" transform="rotate(150 256 256)"/>
    <line x1="256" y1="66" x2="256" y2="86" transform="rotate(210 256 256)"/>
    <line x1="256" y1="66" x2="256" y2="86" transform="rotate(240 256 256)"/>
    <line x1="256" y1="66" x2="256" y2="86" transform="rotate(300 256 256)"/>
    <line x1="256" y1="66" x2="256" y2="86" transform="rotate(330 256 256)"/>
  </g>
  
  <!-- Hour hand (10:10 position for aesthetics) -->
  <line x1="256" y1="256" x2="256" y2="156" 
        stroke="url(#handGradient)" 
        stroke-width="12" 
        stroke-linecap="round"
        transform="rotate(-60 256 256)"
        filter="url(#shadow)"/>
  
  <!-- Minute hand (10:10 position) -->
  <line x1="256" y1="256" x2="256" y2="116" 
        stroke="url(#handGradient)" 
        stroke-width="8" 
        stroke-linecap="round"
        transform="rotate(60 256 256)"
        filter="url(#shadow)"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="16" fill="#667eea"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>
</svg>
